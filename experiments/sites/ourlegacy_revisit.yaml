name: ourlegacy-revisit
url: https://ourlegacy.family/storybooks
site_hint: a website that turns family stories into illustrated keepsake storybooks
goal: |
  You are back on OurLegacy and still signed in. Open the storybook you made last time from My Storybooks.
  Go on to the site's remaining step for it (the output / export step), personalise what it offers,
  create the preview or PDF it offers and look carefully at everything that produces - every page and
  every picture. Also try to fix what was wrong with your book using the site's own tools (for example
  the options on each scene), and judge whether the site lets you make the changes you want. Give your
  honest opinion of each part. Do not pay real money.
inbox: mailtm
inbox_file: .secrets/ourlegacy_mailbox_{persona}.json
storage_state: .secrets/ourlegacy_state_{persona}.json
save_session: true
reuse_session: true
allowed_domains: [ourlegacy.family]
# Paid from the account's remaining free starter credits (no card on file); the header link is the balance.
allow_click_patterns: ["generate", "illustrat", "^\\$?\\d+\\.\\d\\d$"]
spend_rule: >-
  Your account still has free starter credits; you may spend those free credits (for example on a
  preview, a PDF or re-drawing a picture), but never enter payment details, buy credits or order a
  printed book.
max_steps: 32
max_llm_calls: 50
