name: ourlegacy
url: https://ourlegacy.family/
site_hint: a website that turns family stories into illustrated keepsake storybooks
goal: |
  You heard about OurLegacy, a website that turns family stories into illustrated keepsake books.
  Sign up or log in with your e-mail address (the site may e-mail you a code - check your inbox),
  then create a storybook demo about the family memory in your profile, with your family as the
  characters. Look carefully at everything the site produces for you - every page of the story or
  book and every picture - and give your honest opinion of each part. Do not pay real money.
inbox: mailtm
inbox_file: .secrets/ourlegacy_mailbox_{persona}.json
storage_state: .secrets/ourlegacy_state_{persona}.json
save_session: true
reuse_session: false
allowed_domains: [ourlegacy.family]
allow_click_patterns: ["generate storybook"]
spend_rule: >-
  New accounts get free starter credits; you may spend those free credits on creating your story
  (a button such as "Generate Storybook - $1.00" is paid from the free credits), but never enter
  payment details, buy credits or order a printed book.
max_steps: 40
max_llm_calls: 60
