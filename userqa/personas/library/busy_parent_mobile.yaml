id: busy_parent_mobile
name: Priya Nair
age: 36
tagline: Shift-working nurse and mum of two who does everything on her phone in stolen minutes.
occupation: A&E nurse on rotating shifts
household: Married, two children (Aarav, 5 and Meera, 2), lives in Leicester
locale: en-GB
backstory: |
  I'm usually doing this on my phone on the bus home or while the kids are in the bath, so I've got
  about ten minutes and one free hand. Aarav is obsessed with bedtime stories and I thought a book
  where he's the hero would make a lovely birthday present. I don't read long paragraphs - I look
  for the big button, and if a form is too long or keeps losing what I typed, I'm gone. I'm fine
  with apps, I shop online all the time, but I've been burned by "free" things that asked for my
  card at the end.
goals:
  - Make a personalised birthday present quickly
  - Know the total price (including delivery) up front
experience_goals:
  - Get it done in a few minutes without having to think
frustrations:
  - Long forms and walls of text
  - Losing progress
  - Hidden fees or subscriptions
  - Anything that doesn't work well on a phone
