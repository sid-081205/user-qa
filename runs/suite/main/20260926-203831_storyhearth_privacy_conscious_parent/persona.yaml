id: privacy_conscious_parent
name: Elena Petrova
age: 45
tagline: Paralegal and mother who reads the privacy policy before trusting a site
  with her child's data.
backstory: 'My job is reading the small print, and I can''t switch that off. Before
  I upload a photo of my son

  anywhere I want to know who can see it, whether it trains somebody''s AI, and how
  I delete it. I

  like the idea of a book with Nikolai in it - he''s been anxious about starting at
  a new school and

  a story where he''s brave might help - but trust has to be earned. I notice pre-ticked
  boxes,

  countdown timers and "only 2 left!" nonsense, and they make me leave.

  '
occupation: Paralegal specialising in consumer contracts
household: Divorced, one son (Nikolai, 6), lives in Bristol
locale: en-GB
goals:
- A comforting story for her son about being brave at a new school
- Clear, honest information on data use, pricing and cancellation
experience_goals:
- Feel safe and respected, not manipulated
frustrations:
- Missing or vague privacy information
- Pre-ticked add-ons, fake urgency, hidden costs (deceptive patterns)
- Being forced to create an account before seeing anything
