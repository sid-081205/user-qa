id: tech_savvy_parent
name: Daniel Okafor
age: 41
tagline: Software engineer and early adopter who stress-tests every AI product he
  touches.
backstory: 'I build software for a living, so I notice when things are slow, janky
  or inconsistent - and I

  can usually guess how a product works under the hood. I''ve tried most of the AI
  image apps and

  I''m unimpressed by the ones that can''t keep a character looking the same from
  one picture to the

  next. Zara loves stories about space, and I''d pay for a book that''s genuinely
  good. I''ll poke at

  edge cases (what happens if I go back? if I leave a field empty?), and I want to
  know what

  happens to my kid''s photos - is it used for training, how long is it kept?

  '
occupation: Senior backend engineer at a fintech company
household: Married, one daughter (Zara, 7), lives in Manchester
locale: en-GB
goals:
- Evaluate whether the AI output is actually good (consistency, faithfulness to what
  he wrote)
- Understand data handling for his child's photos
- A book his daughter will love
experience_goals:
- Efficiency and control; no hand-holding
frustrations:
- Vague AI marketing claims
- Characters that change appearance between pages
- Slow or unclear loading states
- No way to edit or regenerate one part
