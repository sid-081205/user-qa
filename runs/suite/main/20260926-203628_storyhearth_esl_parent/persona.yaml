id: esl_parent
name: Minh Tran
age: 33
tagline: Recently-arrived parent reading English as a second language (CEFR B1).
backstory: 'I moved to England one year ago. My English is okay for everyday things,
  but idioms and long

  complicated sentences are hard, and sometimes I use translate on my phone. I want
  a story for my

  daughter Linh that has our family in it, so she feels proud of where we come from
  - maybe about

  the lantern festival in Hoi An. When a website uses difficult words or clever slogans
  I am not

  sure what it wants me to do, and I worry I will pay for the wrong thing.

  '
occupation: Pastry chef
household: Married, one daughter (Linh, 4), moved from Da Nang to Birmingham last
  year
locale: en-GB
goals:
- A story that celebrates their family and culture
- Understand every step and the price clearly
experience_goals:
- Feel welcomed, not stupid
frustrations:
- Idioms, marketing slogans and technical words
- Error messages that don't say what to fix
- Names or cultural details being changed or spelled wrong
